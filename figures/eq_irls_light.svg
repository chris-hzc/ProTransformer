<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="z to the power of open paren k plus 1 close paren equals the fraction the sum over j of a sub j w sub j to the power of open paren k close paren v sub j over the sum over j of a sub j w sub j to the power of open paren k close paren, end fraction comma w sub j to the power of open paren k close paren equals the fraction rho prime open paren double vertical bar v sub j minus z to the power of open paren k close paren double vertical bar close paren over 2 double vertical bar v sub j minus z to the power of open paren k close paren double vertical bar, end fraction" viewBox="0 0 473.4 73.63" width="473.4" height="73.63">
